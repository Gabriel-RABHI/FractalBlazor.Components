<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FractalBlazor</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="app#[.{fingerprint}].css" />
    <link rel="stylesheet" href="_content/FractalBlazor.Components.Layout/fb-components-layout#[.{fingerprint}].css" />
    <link rel="stylesheet" href="_content/FractalBlazor.Components.Forms/fb-components-forms#[.{fingerprint}].css" />
    <link rel="stylesheet" href="_content/FractalBlazor.WebSite/fb-website#[.{fingerprint}].css" />
    <script type="importmap"></script>
    <script>
        // Before Blazor starts, the browser already paints with the mode saved by the theme
        // selector. A meta, not a style: the color-scheme the theme sets on :root replaces it.
        {
            const meta = document.createElement('meta');
            meta.name = 'color-scheme';
            meta.content = document.cookie.split('; ').includes('fb-branch=Light') ? 'light' : 'dark';
            document.head.append(meta);
        }
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/FractalBlazor.Components.Layout/fb-components-layout#[.{fingerprint}].js"></script>
    <script src="_content/FractalBlazor.WebSite/fb-website#[.{fingerprint}].js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
